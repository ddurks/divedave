name: Deploy divedave to S3 + CloudFront
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Sync assets (long cache)
        run: aws s3 sync divedave-web s3://divedave.drawvid.com --delete --exclude "*.html" --exclude "node_modules/*" --exclude ".git/*" --exclude ".DS_Store" --cache-control "public, max-age=31536000, immutable"
      - name: Sync HTML (short cache)
        run: aws s3 sync divedave-web s3://divedave.drawvid.com --exclude "*" --include "*.html" --cache-control "public, max-age=3600"
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E19FEOYHE02U7G --paths "/*"
